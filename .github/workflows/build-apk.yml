name: Build Pixel Arena APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PixelArena-Android-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify, extract and patch Android source
        run: |
          set -euo pipefail
          test -s PixelArena-Android-Source.zip
          mkdir -p build-src
          unzip -q PixelArena-Android-Source.zip -d build-src
          PROJECT=build-src/pixelarena-project
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          # Android app-widget description must reference a string resource, not raw text.
          mkdir -p "$PROJECT/app/src/main/res/values"
          cat > "$PROJECT/app/src/main/res/values/strings.xml" <<'EOF'
          <resources>
              <string name="app_name">Pixel Arena</string>
              <string name="widget_description">Autonomous pixel-art battles between Hero and Skullwolf</string>
          </resources>
          EOF
          sed -i 's/android:description="Autonomous pixel-art battles between Hero and Skullwolf"/android:description="@string\/widget_description"/' "$PROJECT/app/src/main/res/xml/arena_widget_info.xml"
          # Keep Java and Kotlin bytecode targets aligned (Java defaults to 1.8).
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-src/pixelarena-project/app/build.gradle.kts")
          s = p.read_text()
          marker = "    defaultConfig { applicationId = \"com.jaydeep.pixelarena\"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = \"1.0\" }"
          if marker not in s:
              raise SystemExit("Could not locate defaultConfig to apply JVM compatibility fix")
          s = s.replace(marker, marker + """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """)
          s = s.replace("\n}", """
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """)
          p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: build-src/pixelarena-project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelArena-debug-apk
          path: build-src/pixelarena-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

name: Build Pixel Arena APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PixelArena-Android-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract Android source
        run: |
          test -s PixelArena-Android-Source.zip
          mkdir -p build-src
          unzip -q PixelArena-Android-Source.zip -d build-src
          test -f build-src/pixelarena-project/settings.gradle.kts
          test -f build-src/pixelarena-project/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: build-src/pixelarena-project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelArena-debug-apk
          path: build-src/pixelarena-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
